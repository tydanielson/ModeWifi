<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Skadi - Van Monitoring System</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Real-time van telemetry and remote control system">
    <meta name="theme-color" content="#e94560">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Skadi">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .login-container {
            background: rgba(26, 26, 46, 0.9);
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #e94560 0%, #ff6b8a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .logo p {
            color: #9a9a9a;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e8e8e8;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #2d3748;
            background: #1a202c;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #e94560;
            background: #2d3748;
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.1);
        }

        input::placeholder {
            color: #718096;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #e94560 0%, #ff6b8a 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #d63851 0%, #e94560 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            background: #4a5568;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background-color: rgba(233, 69, 96, 0.1);
            border-left: 4px solid #e94560;
            color: #ff6b8a;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .footer a {
            color: #e94560;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }

        .van-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="van-icon">🚐</div>
            <h1>SKADI</h1>
            <p>Van Monitoring System</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="your@email.com" 
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password" 
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                Sign In
            </button>
        </form>

        <div class="footer">
            Skadi Van Monitor v1.0.11 • Built with ❤️ for vanlife
        </div>
    </div>

    <script>
        const CONFIG = {
            userPoolId: 'us-east-1_QsHeSEliK',
            clientId: '6frrg18sjku91vd95hvgfc9eqh',
            region: 'us-east-1'
        };

        // Import Amazon Cognito Identity SDK
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.6/dist/amazon-cognito-identity.min.js';
        document.head.appendChild(script);

        script.onload = function() {
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                // Disable button and show loading
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="loading"></span>';
                errorMessage.classList.remove('show');

                try {
                    const poolData = {
                        UserPoolId: CONFIG.userPoolId,
                        ClientId: CONFIG.clientId
                    };
                    const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

                    const authenticationData = {
                        Username: email,
                        Password: password,
                    };
                    const authenticationDetails = new AmazonCognitoIdentity.AuthenticationDetails(authenticationData);

                    const userData = {
                        Username: email,
                        Pool: userPool
                    };
                    const cognitoUser = new AmazonCognitoIdentity.CognitoUser(userData);

                    cognitoUser.authenticateUser(authenticationDetails, {
                        onSuccess: function(result) {
                            const idToken = result.getIdToken().getJwtToken();
                            const accessToken = result.getAccessToken().getJwtToken();
                            
                            // Store tokens
                            localStorage.setItem('idToken', idToken);
                            localStorage.setItem('accessToken', accessToken);
                            
                            // Redirect to dashboard
                            window.location.href = '/index.html';
                        },
                        onFailure: function(err) {
                            console.error('Login failed:', err);
                            showError(err.message || 'Login failed. Please check your credentials.');
                            loginBtn.disabled = false;
                            loginBtn.textContent = 'Sign In';
                        },
                        newPasswordRequired: function(userAttributes, requiredAttributes) {
                            // Handle new password requirement (first login)
                            showError('New password required. Please contact administrator.');
                            loginBtn.disabled = false;
                            loginBtn.textContent = 'Sign In';
                        }
                    });
                } catch (error) {
                    console.error('Authentication error:', error);
                    showError('An error occurred. Please try again.');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign In';
                }
            });

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.add('show');
            }
            
            function isTokenValid() {
                const token = localStorage.getItem('idToken');
                if (!token) return false;
                
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    const expiry = payload.exp * 1000; // Convert to milliseconds
                    
                    // Check if token is expired (with 5 min buffer)
                    return Date.now() < (expiry - 300000);
                } catch (e) {
                    console.error('Error checking token:', e);
                    return false;
                }
            }

            // CRITICAL: Clear expired tokens FIRST before any redirects
            const oldToken = localStorage.getItem('idToken');
            if (oldToken && !isTokenValid()) {
                console.log('Expired token found on login page, clearing localStorage');
                localStorage.removeItem('idToken');
                localStorage.removeItem('accessToken');
                sessionStorage.clear();
            }

            // Check if already logged in with valid token (after clearing expired ones)
            if (isTokenValid()) {
                console.log('Valid token found, redirecting to dashboard');
                window.location.href = '/index.html';
            }
            
            // Register Service Worker for PWA with update detection
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('Service Worker registered');
                        // Force check for updates
                        registration.update();
                    })
                    .catch(error => {
                        console.error('Service Worker registration failed:', error);
                    });
            }
        };
    </script>
</body>
</html>
